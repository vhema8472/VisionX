<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - WorkHub Management Suite</title>
  <meta name="disclaimer" content="Academic Demo Prototype - No real credentials or financial data are processed.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-body">

  <div class="login-card fade-in">
    <div class="login-header">
      <div class="login-logo">W</div>
      <h1 class="login-title">WorkHub Admin</h1>
      <p class="login-subtitle">Smart Workspace & Cafe Management System (Demo)</p>
    </div>

    <div id="login-error-msg" class="badge badge-danger text-center" style="display:none; padding:0.6rem; font-size:0.85rem;"></div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="admin@workhub.com" required autocomplete="off">
      </div>

      <div class="form-group">
        <div class="flex justify-between items-center">
          <label class="form-label" for="login-password">Password</label>
          <a href="#" style="font-size:0.78rem;" onclick="alert('Demo Admin Password is: admin123'); return false;">Forgot password?</a>
        </div>
        <div style="position:relative;">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="off">
          <button type="button" id="toggle-password" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); font-size:1.1rem; color:var(--text-muted);">👁️</button>
        </div>
      </div>

      <div class="flex justify-between items-center" style="margin-bottom: 1.25rem;">
        <label class="flex items-center gap-2" style="font-size:0.85rem; cursor:pointer;">
          <input type="checkbox" id="remember-me" checked>
          <span>Remember me for 30 days</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="padding:0.75rem; font-size:1rem;">Sign In to Dashboard</button>
    </form>

    <div class="text-center" style="border-top:1px solid var(--border-color); padding-top:1rem; margin-top:0.5rem;">
      <a href="../index.html" class="text-muted" style="font-size:0.85rem;">← Back to Main Website</a>
    </div>

    <div style="background-color: var(--light-blue-bg); padding:0.75rem; border-radius:var(--radius-md); font-size:0.78rem; color:var(--primary-blue);" class="text-center">
      🎓 <strong>Academic Demo Credentials:</strong><br>
      Email: <code>admin@workhub.com</code> | Password: <code>admin123</code>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
